<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebBlox</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
<style>
  html, body { height: 100%; margin: 0; background: #111214; color: #e8eaed; font: 15px/1.5 system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .boot { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 16px; }
  .boot svg { width: 44px; height: 44px; animation: spin 1.1s linear infinite; }
  .boot p { margin: 0; color: #9aa0a6; max-width: 420px; }
  .boot button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 9px; border: 0; background: #e8eaed; color: #111214; cursor: pointer; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
</style>
</head>
<body>
<div class="boot" id="boot" role="status">
  <svg viewBox="157 157 710 710" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M307.201 157.281L157.281 716.799L716.799 866.719L866.719 307.201L307.201 157.281ZM569.242 611.157L412.893 569.242L454.807 412.893L611.219 454.807L569.242 611.157Z"/></svg>
  <p id="boot-text">Loading WebBlox…</p>
</div>
<script>
// WebBlox in one file. It fetches WebBlox from jsDelivr and writes it into this page, so you stay on
// this file the whole time. Every file comes from one commit, so versions never mix. If a jsDelivr
// host is slow or blocked, another one takes over, and the one that worked is used from then on.
(function () {
  'use strict';
  var REPO = 'sealiee11/webblox', BRANCH = 'jsdelivr-probe';
  var HOSTS = ['https://cdn.jsdelivr.net', 'https://gcore.jsdelivr.net', 'https://fastly.jsdelivr.net'];
  var TAKE_OVER_MS = 2500;
  var store = {
    get: function (key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
    set: function (key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
  };
  var preferred = (store.get('webblox.cdn') || {}).host;
  var hosts = HOSTS.slice();
  if (HOSTS.indexOf(preferred) > 0) { hosts.splice(hosts.indexOf(preferred), 1); hosts.unshift(preferred); }

  function load(ref, host) {
    var base = host + '/gh/' + REPO + '@' + ref + '/';
    return fetch(base + 'embed.html', { cache: ref === BRANCH ? 'no-cache' : 'default' }).then(function (r) {
      if (!r.ok) throw new Error(host.replace(/^https?:\/\//, '') + ' answered ' + r.status);
      return r.text().then(function (html) {
        if (html.indexOf('%%BASE%%') < 0) throw new Error(host.replace(/^https?:\/\//, '') + ' sent something else');
        return { base: base, host: host, ref: ref, html: html };
      });
    });
  }

  // The preferred host first; the next one joins in if it hasn't answered after a moment or fails.
  function race(ref) {
    return new Promise(function (resolve, reject) {
      var started = 0, failed = 0, done = false, timer = 0;
      function next() {
        clearTimeout(timer);
        if (done || started >= hosts.length) return;
        var host = hosts[started++];
        load(ref, host).then(function (result) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(result);
        }, function (error) {
          if (++failed === hosts.length) reject(error); else next();
        });
        timer = setTimeout(next, TAKE_OVER_MS);
      }
      next();
    });
  }

  // The branch's newest commit, from GitHub. jsDelivr can take hours to notice a new commit on a branch.
  function newest() {
    return fetch('https://api.github.com/repos/' + REPO + '/commits/' + BRANCH, { headers: { Accept: 'application/vnd.github.sha' } })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (sha) {
        sha = sha.trim();
        if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('no commit');
        store.set('webblox.build', { sha: sha, at: Date.now() });
        return sha;
      });
  }

  function start() {
    var build = store.get('webblox.build') || {};
    var known = /^[0-9a-f]{40}$/.test(build.sha || '') ? build.sha : '';
    // First visit: ask GitHub for the branch's newest commit (about 0.1 s) rather than load the branch
    // by name, which jsDelivr can keep mapping to an older commit for hours after a new one.
    var pick = known ? Promise.resolve(known) : Promise.race([
      newest().catch(function () { return ''; }),
      new Promise(function (resolve) { setTimeout(function () { resolve(''); }, 800); }),
    ]);
    return pick.then(function (sha) {
      var ref = sha || BRANCH;
      return race(ref).catch(function (error) {
        // A remembered commit that stopped working, or a branch name mapped to a commit without the app.
        return newest().then(function (fresh) {
          return fresh !== ref ? race(fresh) : race(BRANCH);
        }, function () {
          if (ref === BRANCH) throw error;
          return race(BRANCH);
        });
      });
    }).then(function (result) {
      if (result.host !== preferred) store.set('webblox.cdn', { host: result.host, at: Date.now() });
      var boot = { base: result.base, host: result.host, hosts: HOSTS, repo: REPO, branch: BRANCH, ref: result.ref };
      var html = result.html.split('%%BOOT%%').join(JSON.stringify(boot).replace(/</g, '\\u003c')).split('%%BASE%%').join(result.base);
      document.open();
      document.write(html);
      document.close();
    });
  }

  start().catch(function (error) {
    document.getElementById('boot-text').textContent = "WebBlox couldn't load. Check your connection and try again. (" + (error && error.message || error) + ')';
    var retry = document.createElement('button');
    retry.textContent = 'Try again';
    retry.onclick = function () { location.reload(); };
    document.getElementById('boot').appendChild(retry);
  });
})();
</script>
</body>
</html>
